<text x="510" y="641" class="small">Existing SpEL → Common return edge</text>
<text x="40" y="695" class="">The new edge closes this cycle. Removing the method removes only the added graph edge.</text>
<text x="40" y="727" class="small">Blue arrows exist in baseline and repair; the red source edge appears only in the violation stage.</text>
<text x="40" y="758" class="small">Reconstruction from preserved membership and GraphML; not a DCode UI capture. Other dependencies exist.</text>
<text x="40" y="785" class="small">Node labels use package-relative names. Full names, graphs and verification are supplied in the evidence bundle.</text>
