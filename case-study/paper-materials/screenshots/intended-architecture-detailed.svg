<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">Spring Expression intended architecture and controlled dependency cycle</title>
<desc id="desc">All five Common classes and selected API and SpEL nodes. A dashed red component-level rule denies Common to SpEL. A separate solid red source edge from ExpressionUtils to SpelExpressionParser is added by the mutation. Blue baseline edges return through SpelExpression to ExpressionUtils.</desc>
<defs><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b42318"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#23699b"/></marker></defs>
